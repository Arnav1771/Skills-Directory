# Discovery metadata for the Skills-Directory catalog.
# Optional companion to SKILL.md — the agent triggers on SKILL.md frontmatter;
# this file powers human-facing catalog grouping, search, and cross-linking.
name: grimoire
description: "Generate or modify a full app from a plain-English description and push it to a private GitHub repo (with an IMP_DOCS/ folder), via the Grimoire / AppBuilder MCP tools or CLI. Bring-your-own-keys. Say `Grimoire, build me …`."
categories:
  - developer-tools
  - code-generation
  - ai
tags:
  - app-generation
  - scaffolding
  - github
  - mcp
  - byo-keys
  - cli
icon: Wand2
version: "1.0.0"
composesWell:
  - mod
# Cross-agent portability. Needs either the Grimoire MCP tools or the `grimoire`
# CLI (shell), so it runs anywhere with MCP or shell access.
compat:
  claude-code: full
  claude-ai: full
  cursor: full
  codex: full
  copilot: partial
  gemini-cli: full
  windsurf: full
  roo-code: full
