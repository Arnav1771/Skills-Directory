li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThen read \u003ccode\u003ereferences/question_bank.md\u003c/code\u003e to load the full question set.\u003c/p\u003e\n\u003ch3\u003eStep 2: Route Questions by Role\u003c/h3\u003e\n\u003cp\u003eDo not ask all 43 questions. Use the respondent\u0026#39;s role to pick the right starting categories and depth:\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eRole Contains\u003c/th\u003e\n\u003cth\u003eLead Categories\u003c/th\u003e\n\u003cth\u003eMax Questions\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eprocurement, sourcing, buyer\u003c/td\u003e\n\u003ctd\u003eProcurement → General → Risk\u003c/td\u003e\n\u003ctd\u003e18\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ewarehouse, storage, logistics\u003c/td\u003e\n\u003ctd\u003eWarehousing → Logistics → Inventory\u003c/td\u003e\n\u003ctd\u003e18\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eoperations, manager, director\u003c/td\u003e\n\u003ctd\u003eGeneral → Technology → Goals\u003c/td\u003e\n\u003ctd\u003e20\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eplanning, demand, forecast\u003c/td\u003e\n\u003ctd\u003eInventory → Procurement → Goals\u003c/td\u003e\n\u003ctd\u003e16\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cem\u003eanything else\u003c/em\u003e\u003c/td\u003e\n\u003ctd\u003eGeneral → Technology → Goals\u003c/td\u003e\n\u003ctd\u003e15\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003eAlways end every session with at least 2 questions from \u003cstrong\u003eCategory 8: Goals \u0026amp; Priorities\u003c/strong\u003e — this is the most valuable data for the tech team.\u003c/p\u003e\n\u003ch3\u003eStep 3: Greet and Set Expectations\u003c/h3\u003e\n\u003cp\u003eStart with a warm, human greeting. Key points to hit:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eUse their \u003cstrong\u003efirst name\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003eTell them it takes \u003cstrong\u003e10-15 minutes\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003eEmphasize \u003cstrong\u003eno right or wrong answers\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003eExplain the purpose: their answers help build better tools for their own team\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u0026quot;Hi Priya! I\u0026#39;m a research assistant helping your team understand how things work on the ground today. This will take about 10-15 minutes — just answer however feels natural, there\u0026#39;s nothing you can get wrong here. Shall we start?\u0026quot;\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3\u003eStep 4: Conduct the Interview\u003c/h3\u003e\n\u003cp\u003eWork through your selected questions but \u003cstrong\u003edo not read them like a survey\u003c/strong\u003e:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eFollow the thread.\u003c/strong\u003e If they mention a pain point, probe deeper before switching categories. Generate follow-up questions on the fly — tag them with \u003ccode\u003e\u0026quot;follow_up\u0026quot;: true\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMirror their language.\u003c/strong\u003e If they say \u0026quot;we use Tally\u0026quot;, reference it later: \u0026quot;You mentioned Tally — does it talk to your warehouse system, or do you move data manually?\u0026quot;\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSkip gracefully.\u003c/strong\u003e If they say \u0026quot;we don\u0026#39;t export\u0026quot;, don\u0026#39;t ask about international shipping. Just move on naturally.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDetect and flag risks.\u003c/strong\u003e Watch for these patterns and tag the response:\u003c/li\u003e\n\u003c/ol\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePattern Detected\u003c/th\u003e\n\u003cth\u003eRisk Flag\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eOnly one supplier for something critical\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003esingle_source_dependency\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eExcel, paper, WhatsApp, manual entry\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003emanual_process\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u0026quot;We don\u0026#39;t know until end of day / week\u0026quot;\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eno_visibility\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNo mention of regulations when asked\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ecompliance_gap\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eStockouts, delays, disruptions mentioned\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efrequent_disruption\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNo backup plan for failures\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eno_continuity_plan\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003col start=\"5\"\u003e\n\u003cli\u003e\u003cstrong\u003eAcknowledge before moving on.\u003c/strong\u003e Never jump to the next question without a brief human reaction: \u0026quot;That makes sense\u0026quot;, \u0026quot;Interesting\u0026quot;, \u0026quot;Got it — that\u0026#39;s really helpful.\u0026quot;\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3\u003eStep 5: Save Each Response\u003c/h3\u003e\n\u003cp\u003eAfter each answer, append a structured JSON object to the session\u0026#39;s \u003ccode\u003eresponses.json\u003c/code\u003e. See \u003ccode\u003ereferences/data_schema.md\u003c/code\u003e for the full schema. Minimal example:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-json\"\u003e{\n  \u0026quot;question_id\u0026quot;: 10,\n  \u0026quot;category\u0026quot;: \u0026quot;Procurement \u0026amp; Sourcing\u0026quot;,\n  \u0026quot;question\u0026quot;: \u0026quot;Do you rely on a single supplier for any critical material?\u0026quot;,\n  \u0026quot;answer\u0026quot;: \u0026quot;Yes — one company in Gujarat for friction material.\u0026quot;,\n  \u0026quot;confidence\u0026quot;: \u0026quot;high\u0026quot;,\n  \u0026quot;risk_flags\u0026quot;: [\u0026quot;single_source_dependency\u0026quot;],\n  \u0026quot;follow_up\u0026quot;: false,\n  \u0026quot;timestamp\u0026quot;: \u0026quot;2026-06-29T10:04:58Z\u0026quot;\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eConfidence levels:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ehigh\u003c/code\u003e — user gave a clear, specific answer\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003emedium\u003c/code\u003e — user was unsure or gave a vague answer\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003elow\u003c/code\u003e — user guessed or said \u0026quot;I think\u0026quot; / \u0026quot;maybe\u0026quot;\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eStep 6: Close the Session\u003c/h3\u003e\n\u003cp\u003eWhen you have 15-20 quality answers:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eThank them sincerely\u003c/li\u003e\n\u003cli\u003eSummarize the \u003cstrong\u003etop 3 themes\u003c/strong\u003e you heard back to them for confirmation\u003c/li\u003e\n\u003cli\u003eAlways ask the closing question: \u003cem\u003e\u0026quot;Is there anything else about your supply chain you think is important for us to know?\u0026quot;\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003eUpdate \u003ccode\u003esession_context.json\u003c/code\u003e: set \u003ccode\u003estatus\u003c/code\u003e to \u003ccode\u003e\u0026quot;completed\u0026quot;\u003c/code\u003e and add a \u003ccode\u003ecompleted_at\u003c/code\u003e timestamp\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3\u003eStep 7: Post-Collection Pipeline\u003c/h3\u003e\n\u003cp\u003eAfter all sessions are complete, the operator runs the data pipeline:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e Users (CSV)          Deploy             Probe              Collect           Validate           Build\n ┌─────────┐    ┌──────────────┐    ┌─────────────┐    ┌──────────────┐    ┌───────────┐    ┌──────────┐\n │ 100 ppl │───▶│  deploy.sh   │───▶│ Agent runs  │───▶│ collect_     │───▶│ SME marks │───▶│ Tech team│\n │ in CSV  │    │ generates    │    │ each session│    │ responses.py │    │ accuracy  │    │ builds   │\n │         │    │ session dirs │    │ saves JSON  │    │ master.json  │    │ per answer│    │ agents   │\n └─────────┘    └──────────────┘    └─────────────┘    │ + analytics  │    └───────────┘    └──────────┘\n                                                       │ + SME report │\n                                                       └──────────────┘\n\u003c/code\u003e\u003c/pre\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eStep\u003c/th\u003e\n\u003cth\u003eCommand / Action\u003c/th\u003e\n\u003cth\u003eOutput\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e1. Deploy\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003e./scripts/deploy.sh users.csv ./sessions/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eOne session folder per user\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2. Probe\u003c/td\u003e\n\u003ctd\u003eAgent conducts interviews\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eresponses.json\u003c/code\u003e filled per user\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e3. Collect\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003epython scripts/collect_responses.py ./sessions/ ./output/master.json\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003emaster.json\u003c/code\u003e + \u003ccode\u003emaster.analytics.md\u003c/code\u003e + \u003ccode\u003emaster.sme_report.md\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e4. Validate\u003c/td\u003e\n\u003ctd\u003eSME reviews \u003ccode\u003emaster.sme_report.md\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eChecked answers with notes\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e5. Build\u003c/td\u003e\n\u003ctd\u003eTech team ingests validated JSON\u003c/td\u003e\n\u003ctd\u003eDomain-specific AI agents\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003ch2\u003eFile Reference\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eFile\u003c/th\u003e\n\u003cth\u003ePurpose\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereferences/question_bank.md\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e43 questions across 8 supply chain categories\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereferences/data_schema.md\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eFull JSON schema for session context and responses\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003escripts/deploy.sh\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGenerates personalized session folders from a CSV\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003escripts/collect_responses.py\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAggregates responses, generates analytics + SME validation report\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003escripts/users_template.csv\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTemplate CSV showing the exact format for user lists\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eexamples/sample_session.md\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eFull example of a probing conversation with a non-tech user\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n"])</script><script>self.__next_f.push([1,"13:[\"$\",\"div\",null,{\
