ng: the repo link.\u003c/p\u003e\n\u003ch2\u003eRuntime\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eRun \u003cstrong\u003eeverything inside WSL\u003c/strong\u003e (Ubuntu). Never switch environments mid-task.\nOn Windows, drive WSL via \u003ccode\u003ewsl -e bash -lc \u0026quot;...\u0026quot;\u003c/code\u003e; for anything with tricky\nquoting, write a script to a file and run it.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWorking docs folder:\u003c/strong\u003e \u003ccode\u003eIMP Docs/\u003c/code\u003e at the repo root (reuse if present).\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eGround rules (non-negotiable)\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eRead before you write.\u003c/strong\u003e Read the \u003cem\u003efull\u003c/em\u003e codebase before changing a line.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNever fabricate results.\u003c/strong\u003e Every test result, count, and screenshot must be\nreal. If you didn\u0026#39;t run it, say so.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDocument as you go.\u003c/strong\u003e \u003ccode\u003eIMP Docs/PROMPT_TRAIL.md\u003c/code\u003e gets an entry after \u003cem\u003eevery\u003c/em\u003e\nprompt — no exceptions.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTest before you claim done.\u003c/strong\u003e \u0026quot;It compiles\u0026quot; ≠ \u0026quot;it works.\u0026quot; Verify behavior.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVersion everything.\u003c/strong\u003e Outputs in \u003ccode\u003eIMP Docs/\u003c/code\u003e are versioned (\u003ccode\u003ev1\u003c/code\u003e, \u003ccode\u003ev2\u003c/code\u003e, …\nor semver). Supersede prior work; never silently overwrite.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAuthorship — no AI attribution.\u003c/strong\u003e Commits and PRs are authored \u003cstrong\u003eonly\u003c/strong\u003e as\nthe selected git identity. \u003cstrong\u003eNever\u003c/strong\u003e add \u003ccode\u003eCo-Authored-By: Claude\u003c/code\u003e,\n\u003ccode\u003e🤖 Generated with Claude Code\u003c/code\u003e, \u0026quot;Co-authored-by\u0026quot; AI trailers, or any\nClaude/AI mention to commit messages or PR descriptions. Keep messages clean\nand human.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAsk only when blocked.\u003c/strong\u003e Reversible → decide and log it. Irreversible\n(deleting data, force-push, publishing, spending money) → stop and ask.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003eGit identity (auto-selected — do not prompt, do not push to \u003ccode\u003emain\u003c/code\u003e)\u003c/h2\u003e\n\u003cp\u003eThis machine has two identities; because the skill runs in WSL the default is\npersonal. Select per-repo by owner (helper: \u003ccode\u003escripts/select-git-identity.sh\u003c/code\u003e):\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eRepo owner\u003c/th\u003e\n\u003cth\u003ePer-repo identity\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egithub.com/Arnav1771/*\u003c/code\u003e (personal)\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eArnav1771\u003c/code\u003e / \u003ccode\u003earnav.bhargava3@gmail.com\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ework / org repo (Aligned Automation)\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eAABH-AI\u003c/code\u003e / \u003ccode\u003earnav.bhargava@alignedautomation.com\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cul\u003e\n\u003cli\u003eWSL global default is already \u003ccode\u003eArnav1771 / arnav.bhargava3@gmail.com\u003c/code\u003e; \u003ccode\u003egh\u003c/code\u003e is\nauthed to \u003cstrong\u003eArnav1771\u003c/strong\u003e. For an Arnav1771 repo no override is needed.\u003c/li\u003e\n\u003cli\u003eFor a work repo, set identity \u003cstrong\u003eper-repo only\u003c/strong\u003e (never the WSL global, Windows\nconfig, or stored credentials).\u003c/li\u003e\n\u003cli\u003eAlways work on a feature branch (\u003ccode\u003emod/\u0026lt;yyyy-mm-dd\u0026gt;\u003c/code\u003e or \u003ccode\u003efix/\u0026lt;task\u0026gt;\u003c/code\u003e) and open a\n\u003cstrong\u003ePR\u003c/strong\u003e — never push directly to \u003ccode\u003emain\u003c/code\u003e/\u003ccode\u003emaster\u003c/code\u003e unless the user says so.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eThe pipeline (6 phases)\u003c/h2\u003e\n\u003cp\u003eFull checklists and exit criteria live in\n\u003ca href=\"references/phase-playbook.md\"\u003e\u003ccode\u003ereferences/phase-playbook.md\u003c/code\u003e\u003c/a\u003e. Overview:\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePhase\u003c/th\u003e\n\u003cth\u003eGoal\u003c/th\u003e\n\u003cth\u003eExit criteria\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e0 · Setup\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eClone in WSL, install Canary plugin + deps, verify toolchain.\u003c/td\u003e\n\u003ctd\u003eEnv boots clean, deps resolve, no missing tools.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e1 · Audit\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eWritten system map: goal, file map, entry points, data flow, current state.\u003c/td\u003e\n\u003ctd\u003eYou can explain the whole system in a paragraph.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e2 · Test\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eCanary-driven automated + exploratory testing; edge cases, error states, responsiveness, APIs; break it on purpose.\u003c/td\u003e\n\u003ctd\u003eComplete real test log in \u003ccode\u003eIMP Docs/\u003c/code\u003e, Canary reports saved.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e3 · Fix\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eFix every failure; re-run to green. Log broken → root cause → fix → proof.\u003c/td\u003e\n\u003ctd\u003eAll fixable tests pass; the rest logged as known issues.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e4 · Docs\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eVersioned living docs in \u003ccode\u003eIMP Docs/\u003c/code\u003e (templates in \u003ccode\u003ereferences/doc-templates.md\u003c/code\u003e).\u003c/td\u003e\n\u003ctd\u003eAll five docs current \u0026amp; version-stamped.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e5 · Ship\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003ePremium showcase + landing page (\u003ccode\u003efrontend-design\u003c/code\u003e skill), release artifacts if exe/extension/binary, PR.\u003c/td\u003e\n\u003ctd\u003ePR open, site live, releases attached, docs linked.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003eThe five \u003ccode\u003eIMP Docs/\u003c/code\u003e files — \u003ccode\u003eHANDOFF.md\u003c/code\u003e, \u003ccode\u003eTECHSPEC.md\u003c/code\u003e, \u003ccode\u003ePROMPT_TRAIL.md\u003c/code\u003e,\n\u003ccode\u003eDESIGN_CHOICES.md\u003c/code\u003e, \u003ccode\u003eTODOS.md\u003c/code\u003e — scaffold them with\n\u003ccode\u003escripts/scaffold-imp-docs.sh\u003c/code\u003e.\u003c/p\u003e\n\u003ch2\u003eHelper scripts\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"scripts/select-git-identity.sh\"\u003e\u003ccode\u003escripts/select-git-identity.sh \u0026lt;repo-url-or-owner\u0026gt;\u003c/code\u003e\u003c/a\u003e\n— echoes/sets the correct per-repo identity by owner.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"scripts/scaffold-imp-docs.sh\"\u003e\u003ccode\u003escripts/scaffold-imp-docs.sh [repo-root]\u003c/code\u003e\u003c/a\u003e\n— creates \u003ccode\u003eIMP Docs/\u003c/code\u003e with the five versioned doc stubs (won\u0026#39;t overwrite).\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eDefinition of Done\u003c/h2\u003e\n\u003cp\u003eDo not report completion until \u003cstrong\u003eall\u003c/strong\u003e are true: full codebase read · Canary +\nenv verified in WSL · every test run with real results · fixable bugs fixed \u0026amp;\nre-verified (rest logged) · all five \u003ccode\u003eIMP Docs/\u003c/code\u003e current \u0026amp; versioned · showcase +\nlanding page live with premium design · release artifacts built (if applicable)\n· PR opened with a complete description (no AI attribution) · \u003ccode\u003ePROMPT_TRAIL.md\u003c/code\u003e\nupdated for this prompt.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003eReference material\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"references/universal-build-prompt.md\"\u003e\u003ccode\u003ereferences/universal-build-prompt.md\u003c/code\u003e\u003c/a\u003e\n— the full original Universal Build Prompt (source of truth).\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"references/phase-playbook.md\"\u003e\u003ccode\u003ereferences/phase-playbook.md\u003c/code\u003e\u003c/a\u003e — detailed\nper-phase checklists and exit criteria.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"references/doc-templates.md\"\u003e\u003ccode\u003ereferences/doc-templates.md\u003c/code\u003e\u003c/a\u003e — copy-paste\ntemplates for the five \u003ccode\u003eIMP Docs/\u003c/code\u003e files, including the \u003ccode\u003ePROMPT_TRAIL\u003c/code\u003e entry\nformat.\u003c/li\u003e\n\u003cli\u003ePipeline diagram: \u003ca href=\"mod_pipeline_flowchart.svg\"\u003e\u003ccode\u003emod_pipeline_flowchart.svg\u003c/code\u003e\u003c/a\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n"])</script><script>self.__next_f.push([1,"13:[\"$\",\"div\",null,{\"className\":\"flex flex-col gap-6 py-10\",\"children\":[[\"$\",\"div\",null,{\"children\":[[\"$\",\"h1\",null,{\"className\":\"text-2xl font-bold tracking-tight\",\"children\":\"Testing\"}],[\"$\",\"p\",null,{\"className\":\"mt-1 text-sm text-muted\",\"children\":[1,\" skill\",\"\",\" in this category.\"]}]]}],[\"$\",\"$L1c\",null,{\"skills\":[{\"slug\":\"
