6quot;try an experiment on … in a new branch\u0026quot;\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eTwo ways to invoke (prefer the MCP tools)\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eMCP tools (preferred)\u003c/strong\u003e — if the Grimoire MCP server is connected, these\ntools are available: \u003ccode\u003echeck_credentials\u003c/code\u003e, \u003ccode\u003elist_available_models\u003c/code\u003e,\n\u003ccode\u003ebuild_app\u003c/code\u003e, \u003ccode\u003eupdate_app\u003c/code\u003e, \u003ccode\u003eexperiment_app\u003c/code\u003e. Use them directly.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCLI fallback (Claude Code)\u003c/strong\u003e — if no MCP server is present but the\n\u003ccode\u003egrimoire\u003c/code\u003e command is installed, run it in the shell:\n\u003ccode\u003egrimoire keys\u003c/code\u003e, \u003ccode\u003egrimoire models\u003c/code\u003e, \u003ccode\u003egrimoire build \u0026quot;...\u0026quot;\u003c/code\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eIf neither is available, tell the user how to set it up (see\n\u003ca href=\"references/troubleshooting.md\"\u003e\u003ccode\u003ereferences/troubleshooting.md\u003c/code\u003e\u003c/a\u003e) and stop.\u003c/p\u003e\n\u003ch2\u003eBring-your-own-keys\u003c/h2\u003e\n\u003cp\u003eThe engine needs the user\u0026#39;s own \u003cstrong\u003eGitHub token + username\u003c/strong\u003e (to create and push\nthe repo) and \u003cstrong\u003eone AI provider key\u003c/strong\u003e matching the active provider. No Anthropic\nkey is required unless the user picks the \u003ccode\u003eanthropic\u003c/code\u003e provider. Details and the\nkey matrix: \u003ca href=\"references/providers.md\"\u003e\u003ccode\u003ereferences/providers.md\u003c/code\u003e\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003eWorkflow\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eCheck readiness.\u003c/strong\u003e Call \u003ccode\u003echeck_credentials\u003c/code\u003e (or \u003ccode\u003egrimoire keys\u003c/code\u003e). If it\nreports missing keys, tell the user exactly what to set and stop — do not\nattempt a build that will fail.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNail the spec.\u003c/strong\u003e If the request is vague, ask 1–2 sharp questions (stack\npreference? auth? persistence?). A precise prompt yields a better app — see\n\u003ca href=\"references/prompting.md\"\u003e\u003ccode\u003ereferences/prompting.md\u003c/code\u003e\u003c/a\u003e. Do not over-interrogate.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePick provider/model (optional).\u003c/strong\u003e Default is fine. Offer alternatives from\n\u003ccode\u003elist_available_models\u003c/code\u003e only if the user cares. Pass \u003ccode\u003eprovider\u003c/code\u003e/\u003ccode\u003emodel\u003c/code\u003e to\nthe build tool when overriding.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBuild.\u003c/strong\u003e Call \u003ccode\u003ebuild_app(prompt=..., provider=?, model=?)\u003c/code\u003e (or\n\u003ccode\u003egrimoire build \u0026quot;...\u0026quot;\u003c/code\u003e). This can take a minute — say so.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eReport.\u003c/strong\u003e Return the \u003ccode\u003erepo_url\u003c/code\u003e (and \u003ccode\u003elive_url\u003c/code\u003e if deployed), the tech\nstack, file count, and point the user at \u003ccode\u003eIMP_DOCS/HANDOFF.md\u003c/code\u003e for how to run\nit. Note repos are \u003cstrong\u003eprivate\u003c/strong\u003e by default.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eIterate.\u003c/strong\u003e For changes to an existing repo use \u003ccode\u003eupdate_app(repo_url, changes)\u003c/code\u003e; for a throwaway trial use \u003ccode\u003eexperiment_app(repo_url, branch, changes)\u003c/code\u003e (non-destructive — new branch).\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003eGround rules\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eNever ask for keys in chat.\u003c/strong\u003e Credentials live in the MCP server\u0026#39;s env (or\nthe user\u0026#39;s \u003ccode\u003e.env\u003c/code\u003e) — never request or echo them in the conversation.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eConfirm before overwriting.\u003c/strong\u003e \u003ccode\u003eupdate_app\u003c/code\u003e edits an existing repo; make sure\nthe user means that repo. Prefer \u003ccode\u003eexperiment_app\u003c/code\u003e for anything speculative.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eReport honestly.\u003c/strong\u003e Relay the real \u003ccode\u003erepo_url\u003c/code\u003e and any partial failures from\nthe tool result; don\u0026#39;t claim success you can\u0026#39;t see.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNo AI attribution\u003c/strong\u003e on anything you commit on the user\u0026#39;s behalf.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eExamples\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u0026quot;Grimoire, build a FastAPI bookstore API with SQLite.\u0026quot; →\n\u003ccode\u003echeck_credentials\u003c/code\u003e → \u003ccode\u003ebuild_app(prompt=\u0026quot;a FastAPI bookstore API with SQLite\u0026quot;)\u003c/code\u003e\n→ report repo URL + \u003ccode\u003eIMP_DOCS/HANDOFF.md\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u0026quot;Use Claude to build a React dashboard.\u0026quot; →\n\u003ccode\u003ebuild_app(prompt=\u0026quot;a React dashboard ...\u0026quot;, provider=\u0026quot;anthropic\u0026quot;)\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u0026quot;Add dark mode to \u003ca href=\"https://github.com/me/my-app\"\u003ehttps://github.com/me/my-app\u003c/a\u003e.\u0026quot; →\n\u003ccode\u003eupdate_app(repo_url=\u0026quot;https://github.com/me/my-app\u0026quot;, changes=\u0026quot;add a dark-mode toggle\u0026quot;)\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eReference material\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"references/providers.md\"\u003e\u003ccode\u003ereferences/providers.md\u003c/code\u003e\u003c/a\u003e — providers, keys, models.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"references/prompting.md\"\u003e\u003ccode\u003ereferences/prompting.md\u003c/code\u003e\u003c/a\u003e — writing good build prompts.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"references/troubleshooting.md\"\u003e\u003ccode\u003ereferences/troubleshooting.md\u003c/code\u003e\u003c/a\u003e — setup + common errors.\u003c/li\u003e\n\u003cli\u003eFlow diagram: \u003ca href=\"grimoire_flow.svg\"\u003e\u003ccode\u003egrimoire_flow.svg\u003c/code\u003e\u003c/a\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n"])</script><script>self.__next_f.push([1,"13:[\"$\",\"div\",null,{\"className\":\"flex flex-col gap-6 py-10\",\"children\":[[\"$\",\"div\",null,{\"children\":[[\"$\",\"h1\",null,{\"className\":\"text-2xl font-bold tracking-tight\",\"children\":\"Code Generation\"}],[\"$\",\"p\",null,{\"className\":\"mt-1 text-sm text-muted\",\"children\":[1,\" skill\",\"\",\" in this category.\"]}]]}],[\"$\",\"$L1c\",null,{\"skills\":[{\"slug\":\"grimoire\",\"name\":\"grimoire\",\"description\":\"Generate or modify a full app from a plain-English description and push it to a private GitHub repo (with an IMP_DOCS/ folder), via the Grimoire / AppBuilder MCP tools or CLI. Bring-your-own-keys. Say `Grimoire, build me …`.\",\"categories\":[\"developer-tools\",\"code-generation\",\"ai\"],\"tags\":[\"app-generation\",\"scaffolding\",\"github\",\"mcp\",\"byo-keys\",\"cli\"],\"icon\":\"Wand2\",\"version\":\"1.0.0\",\"composesWell\":[\"mod\"],\"hasManifest\":true,\"triggerDescription\":\"Generate or modify a full application from a plain-English description and push it to a private GitHub repo — powered by the Grimoire / AppBuilder engine. Trigger when the user says 'Grimoire', 'build me an app', 'scaffold a project', 'generate an app and push it to GitHub', or asks to update or experiment on a generated repo. Uses the Grimoire MCP tools (build_app / update_app / experiment_app / list_available_models / check_credential
