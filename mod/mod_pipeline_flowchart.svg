<svg xmlns="http://www.w3.org/2000/svg" width="880" height="720" viewBox="0 0 880 720" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Mod skill six-phase build pipeline">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- self-painted background: readable on light & dark GitHub -->
  <rect x="0" y="0" width="880" height="720" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- header -->
  <rect x="24" y="20" width="832" height="72" rx="14" fill="url(#hdr)" filter="url(#sh)"/>
  <text x="44" y="54" fill="#ffffff" font-size="26" font-weight="700">Mod — Universal Build / Fix / Ship</text>
  <text x="44" y="78" fill="#e0e7ff" font-size="14">Invoke: “Mod: your-repo-link”  ·  runs entirely inside WSL  ·  repo URL is the only input</text>

  <!-- phase card template values -->
  <!-- Phase 0 -->
  <g filter="url(#sh)">
    <rect x="40" y="112" width="800" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="40" y="112" width="8" height="76" rx="4" fill="#6366f1"/>
    <circle cx="80" cy="150" r="18" fill="#eef2ff"/>
    <text x="80" y="156" text-anchor="middle" fill="#4f46e5" font-size="18" font-weight="700">0</text>
    <text x="116" y="142" fill="#0f172a" font-size="17" font-weight="700">Environment Setup</text>
    <text x="116" y="165" fill="#475569" font-size="13">Clone in WSL · install Canary plugin + deps · verify toolchain</text>
    <text x="828" y="182" text-anchor="end" fill="#94a3b8" font-size="11" font-style="italic">exit: env boots clean, deps resolve</text>
  </g>
  <!-- Phase 1 -->
  <g filter="url(#sh)">
    <rect x="40" y="200" width="800" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="40" y="200" width="8" height="76" rx="4" fill="#0ea5e9"/>
    <circle cx="80" cy="238" r="18" fill="#e0f2fe"/>
    <text x="80" y="244" text-anchor="middle" fill="#0284c7" font-size="18" font-weight="700">1</text>
    <text x="116" y="230" fill="#0f172a" font-size="17" font-weight="700">Audit &amp; Understand</text>
    <text x="116" y="253" fill="#475569" font-size="13">Written system map: goal · file map · entry points · data flow · state</text>
    <text x="828" y="270" text-anchor="end" fill="#94a3b8" font-size="11" font-style="italic">exit: explain the whole system in a paragraph</text>
  </g>
  <!-- Phase 2 -->
  <g filter="url(#sh)">
    <rect x="40" y="288" width="800" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="40" y="288" width="8" height="76" rx="4" fill="#14b8a6"/>
    <circle cx="80" cy="326" r="18" fill="#ccfbf1"/>
    <text x="80" y="332" text-anchor="middle" fill="#0d9488" font-size="18" font-weight="700">2</text>
    <text x="116" y="318" fill="#0f172a" font-size="17" font-weight="700">Test Everything (Canary-driven)</text>
    <text x="116" y="341" fill="#475569" font-size="13">Automated + exploratory · edge cases · error states · APIs · break it</text>
    <text x="828" y="358" text-anchor="end" fill="#94a3b8" font-size="11" font-style="italic">exit: complete real test log + Canary reports</text>
  </g>
  <!-- Phase 3 -->
  <g filter="url(#sh)">
    <rect x="40" y="376" width="800" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="40" y="376" width="8" height="76" rx="4" fill="#f59e0b"/>
    <circle cx="80" cy="414" r="18" fill="#fef3c7"/>
    <text x="80" y="420" text-anchor="middle" fill="#d97706" font-size="18" font-weight="700">3</text>
    <text x="116" y="406" fill="#0f172a" font-size="17" font-weight="700">Fix What's Broken</text>
    <text x="116" y="429" fill="#475569" font-size="13">Fix → re-run to green · log broken → root cause → fix → proof</text>
    <text x="828" y="446" text-anchor="end" fill="#94a3b8" font-size="11" font-style="italic">exit: fixable tests pass, rest logged</text>
  </g>
  <!-- Phase 4 -->
  <g filter="url(#sh)">
    <rect x="40" y="464" width="800" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="40" y="464" width="8" height="76" rx="4" fill="#8b5cf6"/>
    <circle cx="80" cy="502" r="18" fill="#ede9fe"/>
    <text x="80" y="508" text-anchor="middle" fill="#7c3aed" font-size="18" font-weight="700">4</text>
    <text x="116" y="494" fill="#0f172a" font-size="17" font-weight="700">Documentation (versioned, in IMP Docs/)</text>
    <text x="116" y="517" fill="#475569" font-size="13">HANDOFF · TECHSPEC · PROMPT_TRAIL · DESIGN_CHOICES · TODOS</text>
    <text x="828" y="534" text-anchor="end" fill="#94a3b8" font-size="11" font-style="italic">exit: all five current &amp; version-stamped</text>
  </g>
  <!-- Phase 5 -->
  <g filter="url(#sh)">
    <rect x="40" y="552" width="800" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="40" y="552" width="8" height="76" rx="4" fill="#ec4899"/>
    <circle cx="80" cy="590" r="18" fill="#fce7f3"/>
    <text x="80" y="596" text-anchor="middle" fill="#db2777" font-size="18" font-weight="700">5</text>
    <text x="116" y="582" fill="#0f172a" font-size="17" font-weight="700">Ship</text>
    <text x="116" y="605" fill="#475569" font-size="13">Premium showcase + landing page · release artifacts · open PR</text>
    <text x="828" y="622" text-anchor="end" fill="#94a3b8" font-size="11" font-style="italic">exit: PR open, site live, docs linked</text>
  </g>

  <!-- connectors -->
  <line x1="440" y1="188" x2="440" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="440" y1="276" x2="440" y2="288" stroke="#64748b" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="440" y1="364" x2="440" y2="376" stroke="#64748b" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="440" y1="452" x2="440" y2="464" stroke="#64748b" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="440" y1="540" x2="440" y2="552" stroke="#64748b" stroke-width="2" marker-end="url(#arw)"/>

  <!-- footer note -->
  <text x="44" y="664" fill="#64748b" font-size="12.5">Ground rules: read before you write · never fabricate results · document as you go · version everything</text>
  <text x="44" y="686" fill="#64748b" font-size="12.5">Git identity auto-selected by repo owner · feature branch → PR (never push main) · no AI attribution on commits/PRs</text>
  <text x="44" y="708" fill="#94a3b8" font-size="11.5" font-style="italic">PROMPT_TRAIL.md is appended after every prompt — the living audit log.</text>
</svg>
