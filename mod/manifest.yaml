# Discovery metadata for the Skills-Directory catalog.
# Optional companion to SKILL.md — the agent triggers on SKILL.md frontmatter;
# this file powers human-facing catalog grouping, search, and cross-linking.
name: mod
description: "End-to-end build/fix/ship harness — takes a repo from its current state to shipped, tested, documented, and demonstrable, all inside WSL. Invoke as `Mod:` followed by a repo link."
categories:
  - developer-tools
  - automation
  - testing
tags:
  - build
  - test
  - ship
  - qa
  - wsl
  - pull-request
  - release
icon: Rocket
version: "1.1.0"
composesWell:
  - grimoire
  - claude-assassin
# Cross-agent portability (full = works as-is · partial = core works, some
# steps are Claude-specific · na = not applicable). mod's Canary-recorded QA
# step is Claude-only; the rest of the pipeline is agent-agnostic shell.
compat:
  claude-code: full
  claude-ai: na
  cursor: partial
  codex: partial
  copilot: partial
  gemini-cli: partial
  windsurf: partial
  roo-code: partial
