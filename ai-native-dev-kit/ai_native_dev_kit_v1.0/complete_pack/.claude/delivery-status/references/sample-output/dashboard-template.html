<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery Status</title>
<!--
  delivery-status dashboard template.
  The skill replaces the object between /*DATA-START*/ and /*DATA-END*/ with live data.

  DATA schema:
  {
    program:     "AP Invoice Automation",
    weekOf:      "2026-07-08",
    generatedAt: "2026-07-08 14:30",
    lastRun:     "2026-07-01",         // null on first run
    nextRun:     "2026-07-15",
    overdueRun:  false,                // true -> show "weekly run overdue" nudge
    coverage:    { level: 4, max: 4, note: "Full status available." },
    totals:      { done: 5, total: 10, amber: 2, notStarted: 3, overdue: 1 },
    thisWeek: {
      newTasks:  [ {id, title} ],
      completed: [ {id, title} ],
      updated:   [ {id, title, change} ],   // change: short text, e.g. "amber -> green"
      overdue:   [ {id, title, eta, person} ]
    },
    owners: [ "Priya Mehta", "Michael Torres" ],   // populates the owner filter
    gates:  [ {label:"GATE-1 · Plan", date:"2026-07-03"} ],  // HITL gates -> flag markers on the Gantt
    epics: [
      { id, title, done, total, stories: [
        { id, title, done, total, tasks: [
          { id, title, status,          // "green" | "amber" | "grey"
            person, builder,            // human owner + AI builder ("" if unknown)
            effort,                     // hours (number) -> shown in bar + Effort column (omit if unknown)
            artifacts: [ "src/..." ],
            eta,                        // verbatim schedule text from the board ("Wed AM")
            startDate, endDate,         // normalized ISO yyyy-mm-dd for the Gantt (omit if unknown)
            reviewed,                   // "pass" | "pending" | "fail" | ""
            isNew, changed, overdue }   // booleans
        ]}
      ]}
    ]
  }
-->
<style>
:root{
  --navy:#0F1C3F;--navy-2:#2A3C90;--ink:#1D1D1D;--paper:#F4F7FB;--card:#FFFFFF;
  --line:#D1DFF0;--muted:#64748B;--soft:#94A3B8;--accent:#1C76BC;
  --green:#5CB85C;--green-soft:#E4F3E4;--amber:#FFA631;--amber-soft:#FFF0DB;
  --grey:#94A3B8;--grey-soft:#EEF2F8;--red:#E1554E;
  --shadow:0 1px 2px rgba(15,28,63,.07),0 8px 24px rgba(15,28,63,.08);
}
:root[data-theme="dark"]{
  --ink:#E9EEF6;--paper:#0B1426;--card:#141F38;--line:#26324e;
  --muted:#9FB0CC;--soft:#6B7C9C;--green-soft:#16351d;--amber-soft:#3a2a10;--grey-soft:#1a2438;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E9EEF6;--paper:#0B1426;--card:#141F38;--line:#26324e;
    --muted:#9FB0CC;--soft:#6B7C9C;--green-soft:#16351d;--amber-soft:#3a2a10;--grey-soft:#1a2438;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Calibri,"Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 60px}

/* Header */
header{background:linear-gradient(120deg,var(--navy),var(--navy-2));color:#fff}
.bar{max-width:1180px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.aalogo{height:32px;width:auto;display:block}
.brand .divx{width:1px;height:28px;background:rgba(255,255,255,.22)}
.brand .wm{font-weight:700;font-size:15px;letter-spacing:.01em}
.brand .wmsub{font-weight:600;font-size:12px;color:#CDD9EC}
.hmeta{text-align:right;font-size:12px;color:#CDD9EC;line-height:1.6}
.hmeta b{color:#fff}
.theme-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
.theme-btn:hover{background:rgba(255,255,255,.2)}

/* Coverage banner */
.banner{margin:18px 0 0;padding:11px 15px;border-radius:10px;font-size:13px;display:flex;gap:9px;align-items:center;background:rgba(28,118,188,.08);border:1px solid rgba(28,118,188,.28);color:var(--ink)}
.banner.warn{background:var(--amber-soft);border-color:rgba(255,166,49,.5)}
.banner .lvl{font-weight:700;color:var(--accent);white-space:nowrap}
.nudge{margin-top:10px;padding:9px 14px;border-radius:9px;background:var(--amber-soft);border:1px solid rgba(255,166,49,.5);font-size:12.5px;color:var(--ink)}

/* KPI row */
.kpis{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:14px;margin-top:18px}
@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.kpi-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.kpi-big{font-size:30px;font-weight:800;color:var(--ink);margin-top:4px;line-height:1}
.kpi-big span{font-size:16px;color:var(--muted);font-weight:600}
.kpi-sub{font-size:12px;color:var(--muted);margin-top:5px}
.pbar{height:8px;background:var(--grey-soft);border-radius:99px;overflow:hidden;margin-top:11px}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7cc97c);border-radius:99px}
.delta{font-size:20px;font-weight:800}
.delta.pos{color:var(--green)}.delta.warnc{color:var(--amber)}.delta.redc{color:var(--red)}.delta.neu{color:var(--muted)}

/* This week */
.section-title{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);margin:28px 0 12px}
.section-sub{font-weight:600;text-transform:none;letter-spacing:0;color:var(--soft);font-size:12px}
.week{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:760px){.week{grid-template-columns:1fr 1fr}}
.week-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.week-card h4{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.week-card .dot{width:8px;height:8px;border-radius:50%}
.week-card ul{list-style:none;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.week-card li{line-height:1.4}
.week-card .idtag{font-family:Consolas,monospace;font-size:10.5px;color:var(--accent)}
.week-empty{font-size:12px;color:var(--soft);font-style:italic}

/* Filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:26px 0 14px}
.filters .fl{font-size:12px;color:var(--soft);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.seg{display:inline-flex;background:var(--grey-soft);border-radius:8px;padding:3px}
.seg button{border:none;background:none;font:inherit;font-size:12.5px;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(15,28,63,.1)}
select{font:inherit;font-size:12.5px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}

/* Gantt */
.gantt{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.g-empty{padding:22px;font-size:13px;color:var(--soft);font-style:italic}
.g-head{display:grid;grid-template-columns:230px 1fr 96px;border-bottom:1px solid var(--line);background:var(--paper)}
.g-corner{padding:9px 12px;font-size:10.5px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
.g-corner.r{text-align:right}
.g-axis{position:relative;height:32px}
.g-tick{position:absolute;top:0;font-size:10px;color:var(--soft);padding:9px 0 0 4px;white-space:nowrap}
.g-grid{position:absolute;left:230px;right:96px;top:32px;bottom:0;pointer-events:none;z-index:1}
.g-line{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);opacity:.6}
.g-today::after{content:"today";position:absolute;top:2px;left:4px;font-size:9px;font-weight:700;color:var(--accent)}
.g-gate{position:absolute;top:0;bottom:0;border-left:2px dotted var(--warn)}
.g-gate-flag{position:absolute;top:3px;left:3px;font-size:9px;font-weight:800;letter-spacing:.02em;color:#fff;background:var(--warn);padding:1px 5px;border-radius:4px;white-space:nowrap}
.g-group{padding:8px 12px;font-size:11.5px;font-weight:800;letter-spacing:.03em;color:var(--muted);background:var(--paper);border-top:1px solid var(--line);position:relative;z-index:2}
.g-row{display:grid;grid-template-columns:230px 1fr 96px;border-top:1px solid var(--line);align-items:center;position:relative;z-index:2}
.g-label{padding:8px 10px;overflow:hidden}
.g-l-title{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-meta{font-size:10.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.g-meta .node-id{font-size:10px}
.g-track{position:relative;height:36px}
.g-trackbg{position:absolute;top:9px;left:0;right:0;height:18px;background:var(--grey-soft);border-radius:5px}
.g-bar{position:absolute;top:9px;height:18px;border-radius:5px;min-width:4px;display:flex;align-items:center;padding:0 8px;font-size:10.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}
.g-bar.green{background:var(--green)}
.g-bar.amber{background:var(--amber)}
.g-bar.grey{background:transparent;border:1.5px dashed var(--grey);color:var(--muted)}
.g-bar.overdue{outline:2px solid var(--red);outline-offset:1px}
.g-weight{padding:0 12px;text-align:right;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}

/* Tree */
.epic{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.epic>summary{list-style:none;cursor:pointer;padding:15px 18px;display:flex;align-items:center;gap:12px}
.epic>summary::-webkit-details-marker{display:none}
.chev{transition:.15s;color:var(--soft);font-size:12px}
details[open]>summary .chev{transform:rotate(90deg)}
.epic-title{font-weight:700;font-size:15px;color:var(--ink);flex:1}
.lvl-tag{font-size:9px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:5px;flex-shrink:0}
.lvl-epic{background:var(--navy);color:#fff}
.lvl-story{background:rgba(28,118,188,.15);color:var(--accent)}
.lvl-task{background:var(--grey-soft);color:var(--muted)}
.node-id{font-family:Consolas,monospace;font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0}
.count{font-size:12px;font-weight:700;color:var(--muted);font-family:Consolas,monospace}
.minibar{width:90px;height:6px;background:var(--grey-soft);border-radius:99px;overflow:hidden}
.minibar>i{display:block;height:100%;background:var(--green);border-radius:99px}
.story{border-top:1px solid var(--line)}
.story>summary{list-style:none;cursor:pointer;padding:11px 18px 11px 30px;display:flex;align-items:center;gap:11px;background:rgba(148,163,184,.05)}
.story>summary::-webkit-details-marker{display:none}
.story-title{font-weight:600;font-size:13.5px;color:var(--ink);flex:1}
.task{display:flex;align-items:center;gap:12px;padding:11px 18px 11px 44px;border-top:1px solid var(--line);font-size:13px}
.task:hover{background:rgba(28,118,188,.03)}
.rag{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.rag.green{background:var(--green)}.rag.amber{background:var(--amber)}.rag.grey{background:var(--grey)}
.task-main{flex:1;min-width:0}
.task-title{color:var(--ink);font-weight:600}
.task-id{font-family:Consolas,monospace;font-size:10.5px;color:var(--soft);margin-right:6px}
.task-meta{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:12px;flex-wrap:wrap}
.person{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--ink)}
.person .av{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--navy-2));color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pill{font-size:10.5px;padding:1px 7px;border-radius:99px;font-weight:700}
.pill.builder{background:var(--grey-soft);color:var(--muted)}
.pill.eta{background:rgba(28,118,188,.1);color:var(--accent)}
.pill.new{background:var(--green-soft);color:#2f7d2f}
.pill.overdue{background:rgba(225,85,78,.12);color:var(--red)}
.pill.changed{background:var(--amber-soft);color:#9a6410}
.artifacts{font-family:Consolas,monospace;font-size:10.5px;color:var(--soft)}
.task.hidden,.story.hidden,.epic.hidden{display:none}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--soft);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
</style>
</head>

function initials(name){ if(!name) return "?"; return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function toggleTheme(){
  const r=document.documentElement;
  const cur=r.getAttribute('data-theme');
  const dark=cur? cur==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  r.setAttribute('data-theme', dark?'light':'dark');
}

function render(){
  document.getElementById('hProgram').textContent = DATA.program || '—';
  document.getElementById('hMeta').innerHTML =
    'Week of <b>'+esc(DATA.weekOf)+'</b><br>generated '+esc(DATA.generatedAt);

  // Banner
  const cov=DATA.coverage||{level:1,max:4,note:''};
  const partial = cov.level < cov.max;
  document.getElementById('banner').innerHTML =
    '<div class="banner'+(partial?' warn':'')+'">'+
    '<span class="lvl">Level '+cov.level+' of '+cov.max+'</span><span>'+esc(cov.note)+'</span></div>';
  document.getElementById('nudge').innerHTML = DATA.overdueRun
    ? '<div class="nudge">⏰ The weekly run looks overdue — this dashboard may be stale. Last run '+esc(DATA.lastRun||'never')+'.</div>' : '';

  // KPIs
  const t=DATA.totals||{done:0,total:0}; const pct = t.total? Math.round(t.done/t.total*100):0;
  const w=DATA.thisWeek||{};
  const kd=(w.completed||[]).length, kn=(w.newTasks||[]).length, ku=(w.updated||[]).length, ko=(t.overdue||0);
  document.getElementById('kpis').innerHTML =
    kpi('Overall progress',
      '<div class="kpi-big">'+t.done+'<span>/'+t.total+' done</span></div>'+
      '<div class="pbar"><i style="width:'+pct+'%"></i></div>'+
      '<div class="kpi-sub">'+pct+'% complete · '+(t.amber||0)+' in progress · '+(t.notStarted||0)+' not started</div>') +
    kpiDelta('Completed this week', kd, kd>0?'pos':'neu', '+'+kd) +
    kpiDelta('New tasks this week', kn, kn>0?'warnc':'neu', '+'+kn) +
    kpiDelta('Overdue', ko, ko>0?'redc':'neu', ko);

  // This week panels
  document.getElementById('week').innerHTML =
    weekCard('New tasks', 'var(--amber)', (w.newTasks||[]).map(x=>li(x))) +
    weekCard('Completed', 'var(--green)', (w.completed||[]).map(x=>li(x))) +
    weekCard('Updated', 'var(--accent)', (w.updated||[]).map(x=>li(x, x.change))) +
    weekCard('Overdue', 'var(--red)', (w.overdue||[]).map(x=>li(x, esc(x.eta)+(x.person?' · '+esc(x.person):''))));

  // Filters populate
  const ownerSel=document.getElementById('fOwner');
  (DATA.owners||[]).forEach(o=>{ const opt=document.createElement('option'); opt.value=o; opt.textContent=o; ownerSel.appendChild(opt); });

  (DATA.epics||[]).forEach(e=>{ const opt=document.createElement('option'); opt.value=e.id; opt.textContent=e.title; epicSel.appendChild(opt); });

  // Gantt
  renderGantt();

  // Next week
  renderNextWeek();

  // Tree
  document.getElementById('tree').innerHTML = (DATA.epics||[]).map(renderEpic).join('');

function kpi(label, inner){ return '<div class="kpi"><div class="kpi-label">'+label+'</div>'+inner+'</div>'; }
function kpiDelta(label, n, cls, txt){
  return '<div class="kpi"><div class="kpi-label">'+label+'</div><div class="delta '+cls+'" style="margin-top:6px">'+txt+'</div></div>';
}
function li(x, extra){ return '<li><span class="idtag">'+esc(x.id)+'</span> '+esc(x.title)+(extra?' <span style="color:var(--soft)">— '+extra+'</span>':'')+'</li>'; }
function weekCard(title, color, items){
  const body = items.length? '<ul>'+items.join('')+'</ul>' : '<div class="week-empty">none</div>';
  return '<div class="week-card"><h4><span class="dot" style="background:'+color+'"></span>'+title+' ('+items.length+')</h4>'+body+'</div>';
}

function renderNextWeek(){
  const host=document.getElementById('nextweek');
  const day=86400000, parse=d=>new Date(d+'T00:00:00').getTime();
  const ref = DATA.generatedAt ? parse(DATA.generatedAt.slice(0,10)) : (DATA.weekOf? parse(DATA.weekOf) : null);
  const winStart = ref!=null ? ref+day : null, winEnd = ref!=null ? ref+7*day : null;
  const inWin = d => (d && ref!=null && parse(d)>=winStart && parse(d)<=winEnd);
  const all=[];
  (DATA.epics||[]).forEach(e=>(e.stories||[]).forEach(s=>(s.tasks||[]).forEach(t=>all.push(t))));
  const item=t=>({id:t.id,title:t.title,person:t.person});
  const starting = all.filter(t=>t.status!=='green' && inWin(t.startDate)).map(item);
  const due      = all.filter(t=>t.status!=='green' && inWin(t.endDate)).map(item);
  const carrying = all.filter(t=>t.status==='amber').map(item);
  const risk     = all.filter(t=>t.overdue).map(item);
  const cell = x => li(x, x.person?esc(x.person):null);
  host.innerHTML =
    weekCard('Starting', 'var(--accent)', starting.map(cell)) +
    weekCard('Due', 'var(--amber)', due.map(cell)) +
    weekCard('Carrying over', 'var(--soft)', carrying.map(cell)) +
    weekCard('At risk', 'var(--red)', risk.map(cell));
}

function renderGantt(){
  const host=document.getElementById('gantt');
  const day=86400000, parse=d=>new Date(d+'T00:00:00').getTime();
  const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], wd=d=>WD[new Date(d+'T00:00:00').getDay()];
  const tasks=[];
  (DATA.epics||[]).forEach(e=>(e.stories||[]).forEach(s=>(s.tasks||[]).forEach(t=>{
    if(t.startDate&&t.endDate) tasks.push(Object.assign({epicId:e.id,epicTitle:e.title},t));
  })));
  if(!tasks.length){ host.innerHTML='<div class="g-empty">No scheduled dates yet — run Conductor to add a board with dates, and the timeline will appear here.</div>'; return; }
  let min=Math.min.apply(null,tasks.map(t=>parse(t.startDate)));
  let max=Math.max.apply(null,tasks.map(t=>parse(t.endDate)));
  (DATA.gates||[]).forEach(g=>{ if(g.date){ const m=parse(g.date); if(m<min)min=m; if(m>max)max=m; } });
  min-=3*day; max+=3*day; const span=(max-min)||day;
  const pct=ms=>((ms-min)/span*100);

  // weekly ticks (labels + gridlines)
  let ticks='', lines=''; const firstMon=min-((new Date(min).getDay()+6)%7)*day;
  for(let ms=firstMon; ms<=max; ms+=7*day){ if(ms<min) continue; const x=pct(ms), d=new Date(ms);
    ticks+='<div class="g-tick" style="left:'+x+'%">'+(d.getMonth()+1)+'/'+d.getDate()+'</div>';
    lines+='<div class="g-line" style="left:'+x+'%"></div>'; }
  const nowMs = DATA.generatedAt ? parse(DATA.generatedAt.slice(0,10)) : min-1;
  const today = (nowMs>=min&&nowMs<=max) ? '<div class="g-today" style="left:'+pct(nowMs)+'%"></div>' : '';
  let gates='';
  (DATA.gates||[]).forEach(g=>{ if(!g.date) return; const x=pct(parse(g.date));
    gates+='<div class="g-gate" style="left:'+x+'%"><span class="g-gate-flag">⚑ '+esc(g.label)+'</span></div>'; });

  // rows grouped by epic
  const groups={};
  tasks.forEach(t=>{ (groups[t.epicId]=groups[t.epicId]||{title:t.epicTitle,items:[]}).items.push(t); });
  let rows='';
  Object.keys(groups).forEach(k=>{ const g=groups[k];
    rows+='<div class="g-group">'+esc(g.title)+'</div>';
    g.items.forEach(t=>{ const l=pct(parse(t.startDate)), w=Math.max(pct(parse(t.endDate))-l,1.2);
      const range = (t.startDate===t.endDate)? wd(t.startDate) : wd(t.startDate)+'–'+wd(t.endDate);
      const eff = (t.effort!=null&&t.effort!=='')? t.effort+'h' : '';
      const barTxt = (eff? eff+' · ':'')+range;
      const meta = [t.builder, t.person].filter(Boolean).map(esc).join(' · ');
      rows+='<div class="g-row">'+
        '<div class="g-label"><div class="g-l-title"><span class="node-id">'+esc(t.id)+'</span> '+esc(t.title)+'</div><div class="g-meta">'+meta+'</div></div>'+
        '<div class="g-track"><div class="g-trackbg"></div>'+
          '<div class="g-bar '+t.status+(t.overdue?' overdue':'')+'" style="left:'+l+'%;width:'+w+'%" title="'+esc(t.startDate)+' → '+esc(t.endDate)+'">'+esc(barTxt)+'</div></div>'+
        '<div class="g-weight">'+(eff||'—')+'</div></div>'; });
  });
  host.innerHTML='<div class="g-head"><div class="g-corner">Task</div><div class="g-axis">'+ticks+'</div><div class="g-corner r">Effort</div></div>'+
    '<div style="position:relative"><div class="g-grid">'+lines+today+gates+'</div>'+rows+'</div>';
}

function renderEpic(e){
  const stories=(e.stories||[]).map(renderStory).join('');
  const pct=e.total? Math.round(e.done/e.total*100):0;
  return '<details class="epic" data-epic="'+esc(e.id)+'" open><summary>'+
    '<span class="chev">▶</span><span class="lvl-tag lvl-epic">EPIC</span><span class="node-id">'+esc(e.id)+'</span><span class="epic-title">'+esc(e.title)+'</span>'+
    '<div class="minibar"><i style="width:'+pct+'%"></i></div>'+
    '<span class="count">'+e.done+'/'+e.total+'</span></summary>'+stories+'</details>';
}
function renderStory(s){
  const tasks=(s.tasks||[]).map(renderTask).join('');
  return '<details class="story" open><summary><span class="chev">▶</span>'+
    '<span class="lvl-tag lvl-story">STORY</span><span class="node-id">'+esc(s.id)+'</span>'+
    '<span class="story-title">'+esc(s.title)+'</span><span class="count">'+s.done+'/'+s.total+'</span></summary>'+tasks+'</details>';
}
function renderTask(t){
  const person = t.person? '<span class="person"><span class="av">'+initials(t.person)+'</span>'+esc(t.person)+'</span>' : '<span style="color:var(--soft)">unassigned</span>';
  const builder = t.builder? '<span class="pill builder">'+esc(t.builder)+'</span>' : '';
  const eta = (t.eta && t.status!=='green') ? '<span class="pill eta">Scheduled for: '+esc(t.eta)+'</span>' : '';
  const flags = (t.isNew?'<span class="pill new">NEW</span>':'')+(t.changed?'<span class="pill changed">CHANGED</span>':'')+(t.overdue?'<span class="pill overdue">OVERDUE</span>':'');
  const arts = (t.artifacts&&t.artifacts.length)? '<span class="artifacts">'+t.artifacts.map(esc).join(', ')+'</span>' : '';
  return '<div class="task" data-status="'+t.status+'" data-owner="'+esc(t.person||'')+'">'+
    '<span class="rag '+t.status+'"></span>'+
    '<div class="task-main"><div><span class="lvl-tag lvl-task">TASK</span><span class="node-id">'+esc(t.id)+'</span> <span class="task-title">'+esc(t.title)+'</span> '+flags+'</div>'+
    '<div class="task-meta">'+person+builder+eta+arts+'</div></div></div>';
}

// Filtering
let fStatus='all';
function applyFilters(){
  const owner=document.getElementById('fOwner').value;
  const epic=document.getElementById('fEpic').value;
  document.querySelectorAll('.epic').forEach(ep=>{
    let epVisible=false;
    const epicMatch = (epic==='all' || ep.dataset.epic===epic);
    ep.querySelectorAll('.story').forEach(st=>{
      let stVisible=false;
      st.querySelectorAll('.task').forEach(tk=>{
        const ok = epicMatch &&
          (fStatus==='all'||tk.dataset.status===fStatus) &&
          (owner==='all'||tk.dataset.owner===owner);
        tk.classList.toggle('hidden',!ok);
        if(ok) stVisible=true;
      });
      st.classList.toggle('hidden',!stVisible);
      if(stVisible) epVisible=true;
    });
    ep.classList.toggle('hidden',!epVisible);
  });
}
document.getElementById('segStatus').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON')return;
  document.querySelectorAll('#segStatus button').forEach(b=>b.classList.remove('on'));
  e.target.classList.add('on'); fStatus=e.target.dataset.s; applyFilters();
});
document.getElementById('fOwner').addEventListener('change',applyFilters);
document.getElementById('fEpic').addEventListener('change',applyFilters);

render();
</script>
