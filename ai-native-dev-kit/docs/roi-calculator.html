// ─── Helpers ──────────────────────────────────────────────────────────────────
function uid(){ return Math.random().toString(36).slice(2); }
function makeTask(name,cplx,hours){ return {id:uid(),name:name||"",complexity:cplx||"moderate",hours:hours||0.05}; }
function makeProc(o){ o=o||{}; return {id:uid(),name:"",runsPerWeek:5000,fteCostPerHour:65,residualCapacity:30,taskList:[makeTask("","moderate",0.05)],...o}; }
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// ─── Formatters ───────────────────────────────────────────────────────────────
function fmtK(n){ if(n===undefined||n===null||isNaN(n))return"—"; if(Math.abs(n)>=1e6)return"$"+(n/1e6).toFixed(1)+"M"; if(Math.abs(n)>=1e3)return"$"+(n/1e3).toFixed(1)+"K"; return"$"+Math.round(n).toLocaleString(); }
function fmtPct(n){ return isNaN(n)?"—":Math.round(n)+"%"; }
function fmtNum(n){ return isNaN(n)?"—":Math.round(n).toLocaleString(); }

// ─── Core computation ─────────────────────────────────────────────────────────
function computeMetrics(proc){
  var tasks=proc.taskList||[]; if(!tasks.length)return null;
  var totalHours=tasks.reduce(function(s,t){return s+(Number(t.hours)||0);},0); if(!totalHours)return null;
  var runs=(Number(proc.runsPerWeek)||1)*52;
  var fteCost=Number(proc.fteCostPerHour)||50;
  var laborCost=totalHours*runs*fteCost;
  var residualPct=Math.min(Math.max(Number(proc.residualCapacity)||0,0),100);
  var residualFactor=1-residualPct/100;
  var scenarios={};
  ["best","expected","worst"].forEach(function(sc){
    var tk=sc==="best"?"min":sc==="expected"?"mid":"max";
    var wSavings=0,tCost=0;
    tasks.forEach(function(t){
      var cfg=COMPLEXITY[t.complexity||"moderate"];
      var frac=(Number(t.hours)||0)/totalHours;
      wSavings+=frac*cfg.savings[sc];
      tCost+=(cfg.tokens[tk]/1000)*TOKEN_COST*runs;
    });
    scenarios[sc]={savings:laborCost*wSavings*residualFactor,tokenCost:tCost};
  });
  return{totalHours:totalHours,annualRuns:runs,laborCost:laborCost,residualPct:residualPct,scenarios:scenarios};
}

function paybackStr(months){ if(!isFinite(months))return"Never"; if(months<1)return"< 1 month"; if(months<24)return Math.round(months)+" months"; return(months/12).toFixed(1)+" years"; }

function dominantCplx(taskList){
  var ct={simple:0,moderate:0,complex:0};
  (taskList||[]).forEach(function(t){ct[t.complexity||"moderate"]++;});
  return Object.entries(ct).sort(function(a,b){return b[1]-a[1];})[0][0];
}

function taskSummaryBadges(taskList){
  var ct={simple:0,moderate:0,complex:0};
  (taskList||[]).forEach(function(t){ct[t.complexity||"moderate"]++;});
  return Object.entries(ct).filter(function(e){return e[1]>0;}).map(function(e){
    var k=e[0],c=e[1];
    return'<span style="background:'+COMPLEXITY[k].bg+';color:'+COMPLEXITY[k].color+';border:1px solid '+COMPLEXITY[k].color+'40;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700">'+c+' '+COMPLEXITY[k].label+'</span>';
  }).join('');
}

function handleConnect(){
  var procs=state.procs, devCost=state.devCost, opsCost=state.opsCost;
  var totalInv=devCost+opsCost, lines=[];
  lines.push("Hello Aligned Automation Sales Team,","");
  lines.push("I have been using the Automation30 ROI Calculator and would like to connect to discuss my automation roadmap.","");
  lines.push("─────────────────────────────────────","INVESTMENT PARAMETERS","─────────────────────────────────────");
  lines.push("Development Cost:   $"+devCost.toLocaleString(),"Annual Ops Cost:    $"+opsCost.toLocaleString(),"Total Investment:   $"+totalInv.toLocaleString(),"");
  lines.push("─────────────────────────────────────","PROCESSES CONFIGURED ("+procs.length+")","─────────────────────────────────────");
  procs.forEach(function(p,i){
    var m=computeMetrics(p);
    lines.push("","Process "+(i+1)+": "+(p.name||"(unnamed)"),"  Runs per Week:     "+Number(p.runsPerWeek).toLocaleString(),"  FTE Cost/Hour:     $"+p.fteCostPerHour,"  Residual Capacity: "+p.residualCapacity+"%");
    if(m){lines.push("  Annual Labor Cost: $"+Math.round(m.laborCost).toLocaleString(),"  Expected Savings:  $"+Math.round(m.scenarios.expected.savings).toLocaleString());}
    lines.push("  Tasks ("+(p.taskList||[]).length+"):");
    (p.taskList||[]).forEach(function(t,ti){
      var cl={simple:"Simple",moderate:"Moderate",complex:"Complex"}[t.complexity||"moderate"];
      lines.push("    "+(ti+1)+". ["+cl+"] "+(t.name||"(unnamed task)"));
    });
  });
  lines.push("","─────────────────────────────────────","Please reach out to discuss how Automation30 can help automate my processes.","","Kind regards");
  var subject=encodeURIComponent("Automation30 ROI Calculator — Connect with Sales");
  var body=encodeURIComponent(lines.join("\n"));
  window.location.href="mailto:sales@alignedautomation.com?subject="+subject+"&body="+body;
  state.sent=true; render();
  setTimeout(function(){state.sent=false;render();},4000);
}

function resultsHTML(){
  var procs=state.procs, devCost=state.devCost, opsCost=state.opsCost;
  var n=procs.length, totalInv=devCost+opsCost;
  var pResults=procs.map(function(p,pi){
    var m=computeMetrics(p); if(!m)return null;
    var scenarios={};
    ["best","expected","worst"].forEach(function(sc){
      var sv=m.scenarios[sc].savings, tc=m.scenarios[sc].tokenCost;
      var net=sv-tc-(opsCost/n);
      var roi=totalInv>0?((net-(devCost/n))/(totalInv/n)*100):0;
      var pm=net>0?(totalInv/n)/(net/12):Infinity;
      scenarios[sc]={savings:sv,tokenCost:tc,roi:roi,payback:paybackStr(pm)};
    });
    return{name:p.name||"Process "+(pi+1),totalHours:m.totalHours,annualRuns:m.annualRuns,laborCost:m.laborCost,residualPct:m.residualPct,scenarios:scenarios,taskList:p.taskList};
  }).filter(Boolean);
  function sum(k,f){return pResults.reduce(function(s,p){return s+p.scenarios[k][f];},0);}
  var totSav={best:sum("best","savings"),expected:sum("expected","savings"),worst:sum("worst","savings")};
  var totTok={best:sum("best","tokenCost"),expected:sum("expected","tokenCost"),worst:sum("worst","tokenCost")};
  var net={best:totSav.best-totTok.best-opsCost,expected:totSav.expected-totTok.expected-opsCost,worst:totSav.worst-totTok.worst-opsCost};
  function pROI(k){return totalInv>0?Math.round(((net[k]-devCost)/totalInv)*100):0;}
  function pPay(k){var m=net[k]>0?totalInv/(net[k]/12):Infinity;return paybackStr(m);}
  var totalTasks=pResults.reduce(function(s,p){return s+(p.taskList?p.taskList.length:0);},0);
  return'<div>'+
    '<div style="background:'+C.navy+';border-radius:10px;padding:16px 20px;margin-bottom:16px">'+
      '<div style="font-size:10px;color:#94A3B8;margin-bottom:11px;text-transform:uppercase;letter-spacing:0.7px">Portfolio — '+procs.length+' Processes · '+totalTasks+' Tasks</div>'+
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:13px">'+
        [["Best Case",fmtK(totSav.best),"ROI "+fmtPct(pROI("best"))+" · "+pPay("best"),C.green],["Expected",fmtK(totSav.expected),"ROI "+fmtPct(pROI("expected"))+" · "+pPay("expected"),C.sky],["Worst Case",fmtK(totSav.worst),"ROI "+fmtPct(pROI("worst"))+" · "+pPay("worst"),C.orange]].map(function(m){
          return'<div style="text-align:center"><div style="font-size:10px;color:#94A3B8;margin-bottom:2px">'+m[0]+'</div><div style="font-size:21px;font-weight:700;color:'+m[3]+'">'+m[1]+'</div><div style="font-size:10px;color:#64748B;margin-top:2px">'+m[2]+'</div></div>';
        }).join('')+
      '</div>'+
      '<div style="border-top:1px solid rgba(255,255,255,0.1);padding-top:11px;display:flex;gap:18px;flex-wrap:wrap">'+
        [["Total Investment",fmtK(totalInv)],["Dev Cost",fmtK(devCost)],["Annual Ops",fmtK(opsCost)],["Token Cost (exp.)",fmtK(totTok.expected)],["Net Annual (exp.)",fmtK(net.expected)]].map(function(x){
          return'<div><div style="font-size:9px;color:#64748B">'+x[0]+'</div><div style="font-size:13px;font-weight:600;color:'+C.white+'">'+x[1]+'</div></div>';
        }).join('')+
      '</div>'+
    '</div>'+
    pResults.map(function(pr,i){
      return'<div style="background:'+C.white+';border:1px solid '+C.border+';border-radius:10px;padding:16px 18px;margin-bottom:12px">'+
        '<div style="display:flex;align-items:center;gap:7px;margin-bottom:11px;flex-wrap:wrap">'+
          '<div style="background:'+C.blue+';color:'+C.white+';border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700">'+(i+1)+'</div>'+
          '<div style="font-weight:700;font-size:14px;color:'+C.navy+'">'+esc(pr.name)+'</div>'+
          [[""+fmtNum(pr.annualRuns)+" runs/yr","#EEF4FA",C.blue],[""+pr.totalHours.toFixed(1)+" hrs/exec",C.card,C.slate],[""+fmtK(pr.laborCost)+"/yr labor","#EEF4FA",C.navy],[""+pr.residualPct+"% residual","#FFF3E8",C.orange]].map(function(x){
            return'<span style="background:'+x[1]+';color:'+x[2]+';border:1px solid '+x[2]+'30;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700">'+x[0]+'</span>';
          }).join('')+
        '</div>'+
        '<div style="background:'+C.card+';border-radius:7px;padding:7px 11px;margin-bottom:11px;border:1px solid '+C.border+'">'+
          '<div style="font-size:9px;font-weight:700;color:'+C.slate+';text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px">Task Breakdown</div>'+
          '<div style="display:flex;flex-wrap:wrap;gap:5px">'+
            (pr.taskList||[]).map(function(t,ti){
              var cfg=COMPLEXITY[t.complexity||"moderate"];
              return'<div style="background:'+cfg.bg+';border:1px solid '+cfg.color+'40;border-radius:5px;padding:2px 7px;font-size:11px"><span style="font-weight:700;color:'+cfg.color+'">'+cfg.short+'</span><span style="color:'+C.charcoal+';margin-left:4px">'+esc(t.name||"Task "+(ti+1))+'</span><span style="color:'+C.slate+';margin-left:4px">'+Number(t.hours).toFixed(1)+'h</span></div>';
            }).join('')+
          '</div>'+
        '</div>'+
        '<div style="display:flex;gap:8px">'+
          scenCardHTML("Best",pr.scenarios.best.savings,pr.scenarios.best.roi,pr.scenarios.best.payback,pr.scenarios.best.tokenCost)+
          scenCardHTML("Expected",pr.scenarios.expected.savings,pr.scenarios.expected.roi,pr.scenarios.expected.payback,pr.scenarios.expected.tokenCost)+
          scenCardHTML("Worst",pr.scenarios.worst.savings,pr.scenarios.worst.roi,pr.scenarios.worst.payback,pr.scenarios.worst.tokenCost)+
        '</div>'+
      '</div>';
    }).join('')+
  '</div>';
}

      '</div>'+
      procs.map(function(p,i){return procCardHTML(p,i);}).join('')+
      (canView?'<div style="text-align:center;margin-top:12px"><button onclick="setTab(\'results\')" style="background:'+C.blue+';color:'+C.white+';border:none;border-radius:8px;padding:10px 26px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">View Scenario Analysis →</button></div>':'')+
    '</div>';
  } else if(tab==='results'&&canView){
    bodyContent=resultsHTML();
  } else if(tab==='ai'&&canView){
    bodyContent=connectHTML();

  document.getElementById('root').innerHTML=
    '<div style="background:linear-gradient(120deg,'+C.navy+',#2A3C90)">'+
      '<div style="width:80%;margin:0 auto;padding:18px 0;display:flex;align-items:center;justify-content:space-between;gap:20px">'+
        '<div style="display:flex;align-items:center;gap:14px">'+
          '<img src="'+LOGO+'" alt="Aligned Automation" style="height:34px;width:auto;object-fit:contain;display:block"/>'+
          '<div style="width:1px;height:30px;background:rgba(255,255,255,.22)"></div>'+
          '<span style="font-weight:600;font-size:13px;color:#CDD9EC;letter-spacing:0.02em">Automation30 · ROI Calculator</span>'+
        '</div>'+
      '</div>'+
      '<div style="width:80%;margin:0 auto;padding:6px 0 30px">'+
        '<div style="font-size:36px;font-weight:800;color:#fff;line-height:1.05;white-space:nowrap">Automation30 Agentic AI — <span style="color:'+C.green+'">ROI Calculator</span></div>'+
        '<div style="color:#b7c6dd;margin-top:10px;font-size:14px;white-space:nowrap">Per-task complexity modelling · Scenario analysis · AI-native investment planning</div>'+
      '</div>'+
    '</div>'+
    '<div style="background:'+C.white+';border-bottom:1px solid '+C.border+';box-shadow:0 1px 2px rgba(15,28,63,.05)">'+
      '<div style="width:80%;margin:0 auto;display:flex">'+
        tabBtn('⬡ Configure','input',false)+
        tabBtn('✦ Scenario Analysis','results',!canView)+
        tabBtn('✉ Connect With Us','ai',!canView)+
      '</div>'+
    '</div>'+
    '<div style="width:80%;margin:0 auto;padding:0 0 50px">'+
      '<div style="padding:26px 0;min-height:400px">'+bodyContent+'</div>'+
      '<div style="border-top:1px solid '+C.border+';padding:18px 26px 30px;color:#94A3B8;font-size:12px">Aligned Automation · Automation30 Framework · AI-Native SDLC</div>'+
    '</div>';

  // restore focus
  if(fk){
    var el=document.querySelector('[data-fk="'+fk+'"]');
    if(el){el.focus();try{if(ss!==null)el.setSelectionRange(ss,se);}catch(e){}}
  }
}

render();
</script>
